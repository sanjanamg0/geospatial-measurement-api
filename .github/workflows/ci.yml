name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Tests (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  test-postgis:
    name: Tests (PostgreSQL + PostGIS)
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: geo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d geo"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      GEO_DATABASE_URL: postgres://postgres:postgres@localhost:5432/geo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  celery-integration:
    name: Celery worker + Redis + PostGIS (end to end)
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: geo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d geo"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      GEO_DATABASE_URL: postgres://postgres:postgres@localhost:5432/geo
      GEO_CELERY_BROKER_URL: redis://localhost:6379/0
      GEO_ASYNC: celery
      GEO_DATA_DIR: /tmp/geo-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python manage.py migrate --noinput
      - name: Start worker and API
        run: |
          celery -A geoproject worker -l info > "$RUNNER_TEMP/worker.log" 2>&1 &
          python manage.py runserver 8000 --noreload > "$RUNNER_TEMP/server.log" 2>&1 &
          for _ in $(seq 1 30); do curl -sf localhost:8000/health/ && break; sleep 1; done
          for _ in $(seq 1 30); do grep -q " ready" "$RUNNER_TEMP/worker.log" && break; sleep 1; done
      - name: Upload, process in the worker, filter by bounding box
        run: bash scripts/smoke_async.sh http://localhost:8000
      - name: Worker log
        if: always()
        run: cat "$RUNNER_TEMP/worker.log"
